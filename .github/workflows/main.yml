name: bebop

on:
  workflow_dispatch:
    inputs:
      web_location:
        description: 'web location'
        required: true
      loglevel:
        description: 'log level'
        required: false
        default: 'DEBUG'
      useragent:
        description: 'useragent'
        required: false
        default: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.36'

jobs:
  exec:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: install_and_wait_tor
        run: |
          # Install Tor directly on the runner instead of the unpinned torsocc
          # service container, which repeatedly opened 9050 without ever
          # bootstrapping a circuit. Running Tor here lets us gate on its own
          # authoritative "Bootstrapped 100%" signal and read its log on failure.
          sudo apt-get update -qq
          sudo apt-get install -y tor curl
          # add a readable notice log, then (re)start Tor (default SocksPort 9050)
          echo 'Log notice file /var/log/tor/notices.log' | sudo tee -a /etc/tor/torrc >/dev/null
          sudo service tor restart || sudo service tor start

          echo "Waiting for Tor to bootstrap 100%..."
          ready=0
          for i in $(seq 1 60); do
            if sudo grep -q 'Bootstrapped 100%' /var/log/tor/notices.log 2>/dev/null; then
              echo "Tor bootstrapped (attempt $i)"
              ready=1
              break
            fi
            # surface progress so a slow bootstrap is visible in the log
            sudo grep -o 'Bootstrapped [0-9]*%' /var/log/tor/notices.log 2>/dev/null | tail -1 \
              || echo "attempt $i/60: no bootstrap line yet"
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Tor failed to bootstrap"
            echo "--- tor notices ---"
            sudo tail -n 60 /var/log/tor/notices.log 2>/dev/null || true
            exit 1
          fi

          # Secondary confirmation that a request actually routes. Informational:
          # bootstrap 100% is the authoritative readiness signal, so a slow first
          # circuit here should not fail the job.
          if curl -fsS --socks5-hostname localhost:9050 --max-time 20 -o /dev/null https://example.com; then
            echo "Tor routing confirmed via example.com"
          else
            echo "::warning::bootstrapped but example.com fetch was slow/failed - proceeding"
          fi
      - name: prepare
        run: |
          pip3 install -e .
          pip3 install -r requirements.txt
          sudo apt install --yes proxychains-ng nmap python3-pip jq
      - name: run
        run: |
          python3 -m app \
          --loglevel ${{ inputs.loglevel }} \
          --useragent "${{ inputs.useragent }}" \
          ${{ inputs.web_location }} 2>&1 | tee /tmp/log.txt
        env:
          CENSYS_PERSONAL_ACCESS_TOKEN: ${{ secrets.CENSYS_PERSONAL_ACCESS_TOKEN }}
          CENSYS_ORGANIZATION_ID: ${{ secrets.CENSYS_ORGANIZATION_ID }}
          FOFA_API_KEY: ${{ secrets.FOFA_API_KEY }}
          FOFA_API_MAIL: ${{ secrets.FOFA_API_MAIL }}
          MODAT_API_KEY: ${{ secrets.MODAT_API_KEY }}
          VALIDIN_API_KEY: ${{ secrets.VALIDIN_API_KEY }}
          SECURITYTRAILS_API_KEY: ${{ secrets.SECURITYTRAILS_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          # Out-of-band callback deanon (ACTIVE, opt-in). Left unset = disabled.
          # Set these repo secrets ONLY with authorisation and burner callback
          # infrastructure - the callback exposes your listener to the target.
          # See the OPSEC section in app/oob.py and OPSEC.md.
          BEBOP_OOB_CALLBACK: ${{ secrets.BEBOP_OOB_CALLBACK }}
          BEBOP_OOB_POLL_URL: ${{ secrets.BEBOP_OOB_POLL_URL }}
          BEBOP_OOB_SCHEME: ${{ secrets.BEBOP_OOB_SCHEME }}
          BEBOP_OOB_INJECT: ${{ secrets.BEBOP_OOB_INJECT }}
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bebop-results
          path: |
            /tmp/log.txt
            /tmp/bebop-report.html
            /tmp/bebop-report.md
