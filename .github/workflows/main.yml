name: bebop

on:
  workflow_dispatch:
    inputs:
      web_location:
        description: 'web location'
        required: true
      loglevel:
        description: 'log level'
        required: false
        default: 'DEBUG'
      useragent:
        description: 'useragent'
        required: false
        default: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.36'

jobs:
  exec:
    runs-on: ubuntu-latest
    services:
      torproxy:
        image: ghcr.io/joshhighet/torsocc:latest
        ports:
          - 9050:9050

    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: wait_circuit_built
        run: |
          # 1) wait for the SOCKS proxy port to accept connections (container up)
          echo "Waiting for the Tor SOCKS proxy on localhost:9050..."
          port_open=0
          for i in $(seq 1 30); do
            if timeout 3 bash -c '</dev/tcp/localhost/9050' 2>/dev/null; then
              echo "SOCKS port is open"
              port_open=1
              break
            fi
            echo "port check $i/30: 9050 not open yet, waiting..."
            sleep 2
          done
          if [ "$port_open" -ne 1 ]; then
            echo "::error::Tor SOCKS proxy container never opened port 9050"
            exit 1
          fi

          # 2) wait for Tor to actually route a request. Gate on example.com (a
          # rock-solid, unthrottled target) rather than check.torproject.org,
          # which is frequently rate-limited/unavailable and gives false negatives.
          echo "Waiting for Tor to build a working circuit..."
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --socks5-hostname localhost:9050 --max-time 8 -o /dev/null https://example.com; then
              echo "Tor is routing (attempt $attempt) - ready!"
              ready=1
              break
            fi
            echo "Attempt $attempt/30: Tor not ready yet, waiting..."
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Tor failed to build a working circuit"
            echo "--- diagnostics ---"
            curl -v --socks5-hostname localhost:9050 --max-time 10 https://example.com || true
            exit 1
          fi
      - name: check_proxy
        run: |
          # informational only - confirms exit IP and Tor status, but never fails
          # the job (readiness was already proven above)
          echo "Tor exit check (informational):"
          curl -s --socks5-hostname localhost:9050 --max-time 15 https://check.torproject.org/api/ip \
            || echo "(check.torproject.org unavailable - proceeding, Tor routing already confirmed)"
          echo
      - name: prepare
        run: |
          pip3 install -e .
          pip3 install -r requirements.txt
          sudo apt install --yes proxychains-ng nmap python3-pip jq
      - name: run
        run: |
          python3 -m app \
          --loglevel ${{ inputs.loglevel }} \
          --useragent "${{ inputs.useragent }}" \
          ${{ inputs.web_location }} 2>&1 | tee /tmp/log.txt
        env:
          CENSYS_PERSONAL_ACCESS_TOKEN: ${{ secrets.CENSYS_PERSONAL_ACCESS_TOKEN }}
          CENSYS_ORGANIZATION_ID: ${{ secrets.CENSYS_ORGANIZATION_ID }}
          FOFA_API_KEY: ${{ secrets.FOFA_API_KEY }}
          FOFA_API_MAIL: ${{ secrets.FOFA_API_MAIL }}
          MODAT_API_KEY: ${{ secrets.MODAT_API_KEY }}
          VALIDIN_API_KEY: ${{ secrets.VALIDIN_API_KEY }}
          SECURITYTRAILS_API_KEY: ${{ secrets.SECURITYTRAILS_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          # Out-of-band callback deanon (ACTIVE, opt-in). Left unset = disabled.
          # Set these repo secrets ONLY with authorisation and burner callback
          # infrastructure - the callback exposes your listener to the target.
          # See the OPSEC section in app/oob.py and OPSEC.md.
          BEBOP_OOB_CALLBACK: ${{ secrets.BEBOP_OOB_CALLBACK }}
          BEBOP_OOB_POLL_URL: ${{ secrets.BEBOP_OOB_POLL_URL }}
          BEBOP_OOB_SCHEME: ${{ secrets.BEBOP_OOB_SCHEME }}
          BEBOP_OOB_INJECT: ${{ secrets.BEBOP_OOB_INJECT }}
      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bebop-results
          path: |
            /tmp/log.txt
            /tmp/bebop-report.html
