name: bebop

on:
  workflow_dispatch:
    inputs:
      web_location:
        description: 'web location'
        required: true
      loglevel:
        description: 'log level'
        required: false
        default: 'DEBUG'
      useragent:
        description: 'useragent'
        required: false
        default: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.36'

jobs:
  exec:
    runs-on: ubuntu-latest
    services:
      torproxy:
        image: ghcr.io/joshhighet/torsocc:latest
        ports:
          - 9050:9050

    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: wait_circuit_built
        run: |
          echo "Waiting for Tor to establish circuits..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -s --socks5-hostname localhost:9050 --max-time 5 https://check.torproject.org/api/ip > /dev/null 2>&1; then
              echo "Tor is ready!"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts: Tor not ready yet, waiting..."
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "Error: Tor failed to become ready after $max_attempts attempts"
            exit 1
          fi
      - name: check_proxy
        run: |
          echo "Verifying Tor connection..."
          curl -s --socks5-hostname localhost:9050 https://check.torproject.org/api/ip
          echo "Tor proxy is working correctly!"
      - name: prepare
        run: |
          pip3 install -e .
          pip3 install -r requirements.txt
          sudo apt install --yes proxychains-ng nmap python3-pip jq
      - name: run
        run: |
          python3 -m app \
          --loglevel ${{ inputs.loglevel }} \
          --useragent "${{ inputs.useragent }}" \
          ${{ inputs.web_location }} 2>&1 | tee /tmp/log.txt
        env:
          CENSYS_PERSONAL_ACCESS_TOKEN: ${{ secrets.CENSYS_PERSONAL_ACCESS_TOKEN }}
          CENSYS_ORGANIZATION_ID: ${{ secrets.CENSYS_ORGANIZATION_ID }}
          FOFA_API_KEY: ${{ secrets.FOFA_API_KEY }}
          FOFA_API_MAIL: ${{ secrets.FOFA_API_MAIL }}
          MODAT_API_KEY: ${{ secrets.MODAT_API_KEY }}
          SECURITYTRAILS_API_KEY: ${{ secrets.SECURITYTRAILS_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bebop-results
          path: |
            /tmp/log.txt
            /tmp/bebop-report.html
